<h1>姊妹们...</h1>
<div class="post-time">2012-02-15 23:29</div>
<div class="article-body">
<div>我们跟随同一个声乐老师学习唱歌...</DIV>
<div>我们每年的大年初四会都会相聚在老师家里...</DIV>
<div>有的还在唱歌，有的当了老板，有的逍遥自在，有的...</DIV>
<div>我不是和每个人都非常熟悉或是无话不谈，女孩子总是有自己的小秘密...</DIV>
<div>但是只要和她们见面时，气场总是很舒服...</DIV>
<div>6年了，60年有点悬，16年吧,希望16年以后我们还能相聚在老师家里，像照片里一样...</DIV>
