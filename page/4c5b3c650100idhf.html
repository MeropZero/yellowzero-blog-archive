<div class="post-time">2010-03-13 23:34</div>
<div class="article-body">
<p>非常荣幸再一次和美年达合作，已经是第三年了</P>
<p>第一年是在曼谷拍摄的电视广告，当时只有我一个女主角</P>
<p>第二年有了BOBO的加入，我们组建了缤纷果味快乐家族，我们的快乐从马来西亚开始</P>
<p>
