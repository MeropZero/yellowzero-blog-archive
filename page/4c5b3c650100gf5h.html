<h1>台湾归来，云南卫视《音乐现场》再见</h1>
<div class="post-time">2009-10-09 21:22</div>
<div class="article-body">
从台湾回来了，录了专辑的主打歌曲，拍摄了专辑的照片。很快，很快就要跟大家见面了。<br />
<br />
假期很繁忙，没有跟大家说国庆快乐和中秋快乐，现在补上希望来得及。接下来也许会更加忙。忙让人内心安定。<br />
<br />
10月11号我会再去北京的温都水城参加云南卫视《音乐现场》的直播，这次选唱的歌曲是我一直很喜欢但是却很少有机会唱的《红眼睛》。这次会唱个痛快。<br />

<br />
盛世太平，希望大家一切都好。
