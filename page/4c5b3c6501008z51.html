<h1>情人节快乐</h1>
<div class="post-time">2008-02-15 00:15</div>
<div class="article-body">
<div>&nbsp;<wbr>&nbsp;<wbr>
今天是情人节,快乐的人很快乐,但应该也有很多人很郁闷吧...我呢?白天在公司练习钢琴,跟同事一起聊聊新年的计划,晚饭和几个单身的好朋友一起吃火锅,10点多就回到家里了.还算充实吧!其实昨天就已经收到了一朵玫瑰花,哈,不过是我最要好的女朋友送的,我很喜欢花,情人节没情人OK,但如果没花收我一定会郁闷的,她好像非常了解我,果然,这是今年情人节收到的唯一一朵花.觉得单身挺开心的,但是今天却有点嫉妒,呵呵不管怎样,希望大家都幸福,节日快乐!</DIV>
