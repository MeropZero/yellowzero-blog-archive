<h1>吉隆坡之行-转场地</h1>
<div class="post-time">2009-04-30 14:29</div>
<div class="article-body">
<p><font SIZE="3">拍摄场地2,我们来到了吉隆坡的政府机构附近<br />
<font STYLE="BACKGroUnD-CoLor: #ffffff" COLOR="#808080">那边人很少,很安静,我们可以更顺利的进行拍摄</FONT><br />
计划没有变化快啊,有片乌云向我们盖来,要下雨了,果然过了一段时间下起了阵雨,导致我们只能停下来默默祈祷雨快点停<br />
不过我心里正在祈祷的是雨不要停,这样说不定就能在吉隆坡多呆一天,可以多玩一天,哈哈<br />
一个小时后,雨还是停了...</FONT><br /></P>
