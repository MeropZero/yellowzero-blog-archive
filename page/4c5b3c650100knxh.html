<h1>我的处女作</h1>
<div class="post-time">2010-06-26 01:31</div>
<div class="article-body">
<p>
在那个巷子口，每天都会有个男生呆呆地等在那里，只是为了能见到他心爱的公主。可公主大人总是故作矜持高傲的从他身边走过，其实心里早就开始专注这个男生，有时候公主故意捉弄他绕道而行，男生并没有因此而放弃，仍然坚持每天在巷子口等着她心爱的公主......</P>
<p>
这就是我的妈妈爸爸当年那段甜蜜的爱情故事，我把那段珍贵的回忆用声音记录下来，《骑士》是我的处女作，也是给爸爸妈妈的礼物...<img src="../images/4c5b3c650100knxh_0.jpg" WIDTH="490" HEIGHT="654"  ALT="我的处女作"  TITLE="我的处女作" /><br />
