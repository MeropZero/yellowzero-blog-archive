<h1>节日快乐</h1>
<div class="post-time">2011-05-03 16:23</div>
<div class="article-body">
<div>
此次马来西亚988电台的音乐会圆满落幕，那天唱的很过瘾，在哪里不重要，重要的是和音乐缠绵的每一秒，听着反听里自己的声音，那一刻只有音乐，真的很满足，如果可以脱去做作的演出服和高跟鞋，我想我会更自在，但这些让我觉得不够自在的东西或许可以帮我掩盖表演时的不足，或许能够糊弄到观众，但糊弄不了自己。。。</DIV>
