<h1>彩排时候我哭了</h1>
<div class="post-time">2009-11-20 12:16</div>
<div class="article-body">
<p>在弘一法师圆寂的时候，弘一法师生前的朋友冲上台。我所饰演的李苹香冲上台，唱着歌送别他。<br />
<br />
那一刻，当音乐渐渐往上推的时候，情绪也往上翻涌，觉得真的是生离死别。大概也觉得就这样落幕曲终人散了。<br />
<br />
忍不住在台上嚎啕哭起来，哭的抽搐。吓到了工作人员，说小姐你不用入戏这么over吧。我说我知道，正式演出的时候我会控制的。</P>
