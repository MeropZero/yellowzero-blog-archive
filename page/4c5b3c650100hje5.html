<h1>海南之南</h1>
<div class="post-time">2010-01-08 00:35</div>
<div class="article-body">
<p>
在大冬天来海南是件非常爽的事情，虽然下了飞机外面下着小雨，但是温暖的热带风吹来，浑身的发热。这边的工作人员，还非常不好意思的说，这是海南最冷的冬天，昨天外面还穿短袖了。</P>
<p>&nbsp;<wbr></P>
<p>还没有去酒店，就直接奔到海南特区报做了专访，送了热带美丽的鲜花，我挂在脖子上舍不得拿下来。</P>
<p>&nbsp;<wbr></P>
<p>这次来海南，<span>会作为评委和嘉宾的身份参加<font FACE="Times New Roman">2009</FONT><font FACE="宋体">年度“扬歌有约”海南全民通俗歌曲大奖赛，并在扬歌试听歌城海秀店举办在海南的首次签售会。</FONT></SPAN></P>
<p>&nbsp;<wbr></P>
