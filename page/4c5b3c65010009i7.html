<h1>我亲爱的周老师</h1>
<div class="post-time">2007-03-14 23:01</div>
<div class="article-body">
<DIV><FONT FACE="Courier New">&nbsp;<wbr>&nbsp;<wbr>
<img src="../images/album_4c5b3c6502000vmv.jpg" ALT="我亲爱的周老师"  TITLE="我亲爱的周老师"  style="display:block;margin:12px auto;"/></FONT></DIV>
<DIV><FONT FACE="Courier New">&nbsp;<wbr>&nbsp;<wbr>&nbsp;<wbr>
周筱燕-我的声乐老师,也是我最尊敬的人.记得那个时候我特别想学声乐,希望自己可以唱的更好,千方百计地找到她,拜她为师.她使我唱歌提高了很多.而且带我认识许多好朋友.最重要的是,当初如果不是她硬要我去固牙的话,可能我现在就不会有那么多这样那样机会了.我很感激她.每年的春节,大家都会约好一起去她家里给她拜年.</FONT></DIV>
</div>
