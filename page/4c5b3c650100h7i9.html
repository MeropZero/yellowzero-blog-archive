<h1>冬日午后阳光</h1>
<div class="post-time">2009-12-10 11:58</div>
<div class="article-body">
<p>在12月份的米娜上可以看到我告诉给大家如何在圣诞、新年和春节的狂轰滥炸下把自己弄成最有回头率的女生。<br />
<br />
拍片的时候是在一个冬日的午后，在隐蔽的弄堂餐厅的阁楼上，陈旧的木楼梯吱吱呀呀的响，身上的金属首饰发出清脆的声音，弄堂外有卖棉花糖的机器旋转的声音。希望看到这些照片你们会听到这些声音，并有温暖的感觉。就像那天的阳光会照到你们的身上。<br />
