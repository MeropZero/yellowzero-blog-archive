<h1>我爱麻辣烫</h1>
<div class="post-time">2007-04-13 17:50</div>
<div class="article-body">
<DIV>
一定要吃大时代广场的麻辣烫,只有他们的麻辣烫是让我百吃不腻</DIV>
<DIV>我习惯一个人做在那里享受那个过程,闷吃...</DIV>
<DIV>
最吸引我的是麻辣汤的配料,味道有点像火锅的配料,但是吃火锅太大太奢侈</DIV>
<DIV>健康减肥中的我,几乎每天中午都要享用这碗麻辣汤</DIV>
<DIV>在我心目中,麻辣烫胜过鱼翅汤</DIV>
<DIV>
我推荐减肥的同胞们,吃了这碗麻辣烫,即不会发胖,又有营养,最重要的一点是可以吃的很饱...七八种蔬菜和豆制品,配上一点醋是必不可少的,最多加上几片鱼</DIV>
