<h1>有危险？</h1>
<div class="post-time">2010-06-13 02:18</div>
<div class="article-body">
<p>悟强大师有一天打坐时看见他学生的车被撞了，结果那天那个学生真的撞车了&nbsp;<wbr></P>
<p>昨天他打坐时开到他的朋友晕倒了，结果他的朋友真的脑溢血变成了植物人，就是昨天的事情</P>
<p>大师很后悔没有及时告诉他朋友&nbsp;<wbr></P>
<p>刚刚我收到悟强大师的短信，他说打坐时看到我有危险，叫我要避开，他头很痛</P>
<p>我见到此短信，半信半疑就回问他哪里有危险，并告诉他我正在家里，是安全的</P>
<p>他说他看的不清楚，只看到有个大物体靠近我，叫我这两天要千万小心</P>
<p>不管怎样，我会注意的，不过该发生发生的还是会发生的</P>
<p>谢谢大师提醒，<font STYLE="FonT-siZe: 56px">阿弥陀佛</FONT></P>
</div>
